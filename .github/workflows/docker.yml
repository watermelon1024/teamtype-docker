# SPDX-License-Identifier: AGPL-3.0-or-later

name: Build and publish image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly rebuild to incorporate Alpine base image security patches
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Resolve the latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(gh api repos/teamtype/teamtype/releases/latest --jq .tag_name | sed 's/^v//')"
          if [ -z "$version" ]; then
            echo "Could not determine the latest Teamtype release" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "Packaging Teamtype v${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.upstream.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=teamtype
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests only build amd64 because multi-arch images cannot be loaded into local daemon for smoke tests
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            TEAMTYPE_VERSION=${{ steps.upstream.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Smoke test
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --platform linux/amd64 --entrypoint teamtype "$image" --version
          docker run --rm --platform linux/amd64 "$image" --help

      # Record packaged binary checksums to the workflow summary page
      - name: Record the packaged binary
        if: github.event_name != 'pull_request'
        run: |
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          {
            echo "## Packaged Teamtype binary"
            echo
            echo '```'
            for platform in linux/amd64 linux/arm64; do
              docker run --rm --platform "$platform" --entrypoint cat "$image" \
                /usr/share/doc/teamtype/SHA256SUMS
            done
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
