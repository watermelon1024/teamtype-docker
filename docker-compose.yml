#
# Runs a Teamtype "cloud peer": an always-on daemon for team collaboration.

services:
  teamtype:
    image: ghcr.io/watermelon1024/teamtype-docker:latest
    # Uncomment to build locally instead of pulling from registry:
    # build:
    #   context: .
    container_name: teamtype
    restart: unless-stopped

    # Must match the owner of ./project on the host (image defaults to 1000:1000)
    user: "1000:1000"

    volumes:
      - ./project:/project

    environment:
      # share = host a directory, join = connect to somebody else's directory
      TEAMTYPE_COMMAND: share
      TEAMTYPE_SHOW_SECRET_ADDRESS: "true"
      TEAMTYPE_NO_JOIN_CODE: "false"
      TEAMTYPE_USERNAME: cloud-peer
      # TEAMTYPE_PEER: "<secret address>"           # only for TEAMTYPE_COMMAND=join
      # TEAMTYPE_JOIN_CODE: "5-hamburger-endorse"    # one-time Magic Wormhole code
      # TEAMTYPE_EXTRA_ARGS: "--iroh-relay https://relay.example.org"

    # Teamtype traverses NAT via iroh; host networking gives direct peer connections (Linux only)
    # network_mode: host

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
